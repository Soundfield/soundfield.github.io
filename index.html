<style>
  :root {
    --bg-primary: #0a0a0f; --bg-secondary: #13131a; --bg-card: #1a1a24;
    --accent: #6366f1; --accent-glow: #818cf8;
    --text-primary: #f5f5f7; --text-secondary: #a1a1aa; --border: #27272a;
    --card-shadow: 0 10px 40px rgba(99,102,241,0.15);
    --name-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --upcoming-bg: rgba(245,158,11,0.15); --upcoming-text: #fbbf24;
    --pinned-border: #f59e0b;
  }
  [data-theme="light"] {
    --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-card: #ffffff;
    --accent: #4f46e5; --accent-glow: #6366f1;
    --text-primary: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
    --card-shadow: 0 10px 40px rgba(0,0,0,0.08);
    --upcoming-bg: rgba(217,119,6,0.12); --upcoming-text: #b45309;
    --pinned-border: #d97706;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(99,102,241,.08),transparent 40%),radial-gradient(circle at 80% 80%,rgba(16,185,129,.05),transparent 40%);z-index:-1;pointer-events:none}
  [data-theme="light"] body::before{opacity:.5}

  .theme-toggle,.share-btn,.reel-btn-top{position:fixed;right:5%;z-index:200;border-radius:999px;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;transition:all .2s;font-family:inherit}
  .theme-toggle{top:1.5rem;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);padding:.6rem 1rem;box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .theme-toggle:hover{border-color:var(--accent);transform:translateY(-2px)}
  .theme-toggle svg{width:16px;height:16px}
  .share-btn{top:4.5rem;background:#10b981;color:#fff;border:none;padding:.6rem 1rem;font-weight:600;box-shadow:0 4px 12px rgba(16,185,129,.4)}
  .share-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,185,129,.6)}
  .share-btn svg{width:16px;height:16px}
  .reel-btn-top{top:7.5rem;background:var(--accent);color:#fff;border:none;padding:.6rem 1rem;font-weight:600;box-shadow:0 4px 12px rgba(99,102,241,.4)}
  .reel-btn-top:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.6)}
  .reel-btn-top svg{width:16px;height:16px}

  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#fff;padding:.8rem 1.5rem;border-radius:999px;font-size:.9rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;transition:transform .3s cubic-bezier(.4,0,.2,1);pointer-events:none;white-space:nowrap;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media(max-width:768px){
    .toast{bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);padding:.7rem 1.2rem;font-size:.85rem;max-width:90%;word-wrap:break-word}
    .toast.show{transform:translateX(-50%) translateY(0)}
  }

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;padding:2rem}
  .modal-overlay.active{opacity:1;visibility:visible}
  .modal-box{width:100%;max-width:960px;position:relative;transform:scale(.95) translateY(20px);transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .modal-overlay.active .modal-box{transform:scale(1) translateY(0)}
  .close-modal{position:absolute;top:-45px;right:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
  .close-modal:hover{background:rgba(255,255,255,.25)}
  .modal-video-wrapper{position:relative;padding-bottom:56.25%;height:0;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
  .modal-video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}

  .about-modal-content{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;max-width:640px;width:100%;position:relative}
  .about-modal-content .close-modal{top:1rem;right:1rem;background:var(--bg-secondary);border-color:var(--border);color:var(--text-primary)}
  .about-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem}
  .about-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0}
  .about-title{font-family:var(--name-font);font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--text-primary)}
  .about-text{color:var(--text-secondary);font-size:1rem;line-height:1.7;white-space:pre-line}

  .audio-modal-content{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;max-width:700px;width:100%;position:relative;max-height:85vh;overflow-y:auto}
  .audio-modal-content .close-modal{top:.8rem;right:.8rem;background:var(--bg-secondary);border-color:var(--border);color:var(--text-primary)}
  .audio-modal-header{display:flex;gap:1rem;margin-bottom:1rem}
  .audio-modal-poster{width:50%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;flex-shrink:0}
  .audio-modal-poster img{width:100%;height:100%;object-fit:cover;display:block}
  .audio-modal-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .audio-modal-title{font-family:var(--name-font);font-size:1.15rem;font-weight:700;color:var(--text-primary);line-height:1.2;margin-bottom:.3rem}
  .audio-modal-subtitle{color:var(--text-secondary);font-size:.8rem;line-height:1.4;margin-bottom:.5rem}
  .audio-modal-tags{display:flex;flex-wrap:wrap;gap:.3rem}
  .audio-modal-tags .tag{font-size:.65rem;padding:.15rem .5rem}
  .audio-modal-tags .tag.role{background:rgba(16,185,129,.15);color:#34d399}

  .audio-waveform-area{width:100%;height:56px;border-radius:8px;overflow:hidden;background:var(--bg-secondary);margin-bottom:.8rem;position:relative}

  .audio-track-list{display:flex;flex-direction:column;gap:.3rem}
  .audio-track-row{display:flex;align-items:center;gap:.5rem;padding:.4rem .7rem;border-radius:8px;background:var(--bg-secondary);color:var(--text-secondary);font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid transparent}
  .audio-track-row:hover{background:var(--border);color:var(--text-primary)}
  .audio-track-row.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .audio-track-row svg{width:14px;height:14px;fill:currentColor;flex-shrink:0}
  .audio-track-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .copyright-notice{font-size:.7rem;line-height:1.5;color:var(--text-secondary);text-align:center;padding-top:.8rem;margin-top:.8rem;border-top:1px solid var(--border);opacity:.8}

  .header{padding:3rem 5% 2rem;max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
  .profile-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 30px rgba(99,102,241,.3);flex-shrink:0;background:var(--bg-card)}
  .header-info h1{font-family:var(--name-font);font-size:2.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(135deg,var(--text-primary),var(--accent-glow));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .header-info .tagline{color:var(--text-secondary);font-size:1.1rem;margin-top:.3rem}
  .contact-links{display:flex;gap:.8rem;margin-top:1rem;flex-wrap:wrap;align-items:center}
  .contact-links a{color:var(--text-primary);text-decoration:none;padding:.4rem .9rem;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;font-size:.85rem;transition:all .2s}
  .contact-links a:hover{border-color:var(--accent);transform:translateY(-2px)}
  .about-btn{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;font-weight:600;padding:.45rem 1.1rem!important}
  .about-btn:hover{background:var(--accent-glow)!important;border-color:var(--accent-glow)!important}

  .filter-bar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:1rem 5%;transition:background .3s}
  [data-theme="light"] .filter-bar{background:rgba(248,250,252,.85)}
  .filter-inner{max-width:1400px;margin:0 auto}
  .filter-toggle-btn{display:none;width:100%;padding:.7rem 1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;color:var(--text-primary);font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:.6rem;transition:all .2s;align-items:center;justify-content:center;gap:.5rem}
  .filter-toggle-btn:hover{border-color:var(--accent)}
  .filter-toggle-btn .badge{background:var(--accent);color:#fff;font-size:.7rem;padding:.1rem .5rem;border-radius:999px;font-weight:700}
  .filter-toggle-btn svg{width:16px;height:16px;transition:transform .3s}
  .filter-toggle-btn.open svg{transform:rotate(180deg)}
  .filter-rows-wrapper{display:block}
  .filter-row{display:flex;gap:.8rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
  .filter-row:last-child{margin-bottom:0}
  .filter-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-secondary);font-weight:600;min-width:80px}
  .filter-btn{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);padding:.4rem 1rem;border-radius:999px;font-size:.85rem;cursor:pointer;transition:all .2s;font-family:inherit}
  .filter-btn:hover{color:var(--text-primary);border-color:var(--accent)}
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .result-count{color:var(--text-secondary);font-size:.85rem;margin-top:.5rem}
  @media(max-width:768px){
    .filter-toggle-btn{display:flex}
    .filter-rows-wrapper{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
    .filter-rows-wrapper.open{max-height:500px}
  }

  .projects{max-width:1400px;margin:2rem auto;padding:0 5% 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}
  .project-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:0;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;animation:fadeIn .4s ease;display:flex;flex-direction:column}
  .project-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-glow));opacity:0;transition:opacity .3s}
  .project-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--card-shadow)}
  .project-card:hover::before{opacity:1}
  .project-card.pinned{border-left:3px solid var(--pinned-border)}
  .project-card.pinned::before{background:linear-gradient(90deg,var(--pinned-border),#fbbf24)}

  .card-poster{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--bg-secondary),var(--bg-card));display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:.8rem;border-bottom:1px solid var(--border);overflow:hidden;position:relative}
  .card-poster img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .project-card:hover .card-poster img{transform:scale(1.03)}
  .poster-placeholder{display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:.6}
  .poster-placeholder svg{width:40px;height:40px;opacity:.4}

  .card-content{padding:1.2rem;flex:1;display:flex;flex-direction:column}
  .card-header-row{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.2rem}
  .card-header-left{flex:1;min-width:0}
  .card-category-line{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.15rem}
  .card-category{font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--accent-glow);font-weight:700}
  .upcoming-badge{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--upcoming-text);background:var(--upcoming-bg);padding:.1rem .5rem;border-radius:999px}
  .pinned-badge{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--pinned-border);background:rgba(245,158,11,.1);padding:.1rem .5rem;border-radius:999px}
  .card-title{font-size:1.2rem;font-weight:700;margin-bottom:0;line-height:1.2}

  .card-actions{display:flex;gap:.4rem;flex-shrink:0;margin-top:2px}
  .play-btn,.listen-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,background .2s;border:none}
  .play-btn{background:var(--accent)}
  .play-btn:hover{transform:scale(1.1);background:var(--accent-glow)}
  .play-btn svg{width:16px;height:16px;fill:#fff;margin-left:2px}

}
injectCopyright('audioCopyright', PORTFOLIO_CONFIG.audioCopyright || '');
injectCopyright('pageCopyright', PORTFOLIO_CONFIG.audioCopyright || '');

// Build tooltip map from config
const tooltipMap = {};
PORTFOLIO_CONFIG.filters.forEach(filter => {
  filter.options.forEach(opt => {
    if (opt.tooltip) {
      tooltipMap[`${filter.key}:${opt.value}`] = opt.tooltip;
    }
  });
});

const roleDisplayMap = {};
const roleFilter = PORTFOLIO_CONFIG.filters.find(f => f.key === 'role');
if (roleFilter) {
  roleFilter.options.forEach(o => { roleDisplayMap[o.value] = o.label; });
}

function formatTagName(slug) {
  return slug.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

document.getElementById('profilePhoto').src = PORTFOLIO_CONFIG.profilePhoto || '';
document.getElementById('profileName').textContent = PORTFOLIO_CONFIG.name;
document.getElementById('profileTagline').textContent = PORTFOLIO_CONFIG.tagline;
document.title = PORTFOLIO_CONFIG.pageTitle;

const contactContainer = document.getElementById('contactLinks');
if (PORTFOLIO_CONFIG.aboutTitle && PORTFOLIO_CONFIG.aboutText) {
  const aboutBtn = document.createElement('a');
  aboutBtn.href = '#'; aboutBtn.textContent = 'About'; aboutBtn.className = 'about-btn';
  aboutBtn.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('aboutPhoto').src = PORTFOLIO_CONFIG.profilePhoto || '';
    document.getElementById('aboutTitle').textContent = PORTFOLIO_CONFIG.aboutTitle;
    document.getElementById('aboutText').textContent = PORTFOLIO_CONFIG.aboutText;
    openModalSimple('aboutModal');
  });
  contactContainer.appendChild(aboutBtn);
}
PORTFOLIO_CONFIG.contactLinks.forEach(link => {
  const a = document.createElement('a'); a.href = link.url; a.textContent = link.label; a.target = '_blank';
  contactContainer.appendChild(a);
});

function openModal(modalId, iframeId, embedData) {
  const iframe = document.getElementById(iframeId);
  let src = '';
  const trimmed = embedData.trim();
  if (trimmed.startsWith('<iframe')) {
    const temp = document.createElement('div'); temp.innerHTML = trimmed;
    const f = temp.querySelector('iframe'); if (f) src = f.getAttribute('src') || '';
  } else { src = trimmed; }
  if (src) {
    iframe.src = src.includes('?') ? src + '&autoplay=1' : src + '?autoplay=1';
    document.getElementById(modalId).classList.add('active');
    document.body.style.overflow = 'hidden';
  }
}
function openModalSimple(id) { document.getElementById(id).classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeModal(id) {
  document.getElementById(id).classList.remove('active'); document.body.style.overflow = '';
  const iframe = document.getElementById(id).querySelector('iframe');
  if (iframe) setTimeout(() => { iframe.src = ''; }, 300);
}

document.getElementById('openReelBtn').addEventListener('click', () => openModal('reelModal','reelIframe',PORTFOLIO_CONFIG.reelEmbedUrl));
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => {
  if (e.target === m) { if (m.id === 'audioModal') closeAudioModal(); else closeModal(m.id); }
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => {
    if (m.id === 'audioModal') closeAudioModal(); else closeModal(m.id);
  });
});

// Toast notification
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); }, 2500);
}

// Share button
document.getElementById('shareBtn').addEventListener('click', () => {
  const params = new URLSearchParams();
  Object.keys(activeFilters).forEach(key => {
    if (activeFilters[key] !== 'all') {
      params.set(key, activeFilters[key]);
    }
  });
  const url = window.location.origin + window.location.pathname + (params.toString() ? '#' + params.toString() : '');
  navigator.clipboard.writeText(url).then(() => {
    showToast('✓ Link with current filters copied to clipboard');
  }).catch(() => {
    showToast('⚠️ Could not copy link');
  });
});

// Audio Player
let wavesurferLoaded = false;
let activeWs = null;
let wsScriptEl = null;
let currentTrackIdx = -1;
let currentTracks = [];

function ensureWavesurfer(callback) {
  if (wavesurferLoaded) { callback(); return; }
  if (wsScriptEl) { wsScriptEl.addEventListener('load', callback); return; }
  wsScriptEl = document.createElement('script');
  wsScriptEl.src = 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js';
  wsScriptEl.onload = () => { wavesurferLoaded = true; callback(); };
  wsScriptEl.onerror = () => { console.error('Failed to load Wavesurfer.js'); };
  document.head.appendChild(wsScriptEl);
}

function updateTrackRows(activeIdx, isPlaying) {
  document.querySelectorAll('.audio-track-row').forEach((row, i) => {
    const isActive = i === activeIdx && isPlaying;
    row.classList.toggle('active', isActive);
    row.querySelector('svg').innerHTML = isActive
      ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
      : '<path d="M8 5v14l11-7z"/>';
  });
}

function loadAndPlayTrack(idx) {
  if (idx < 0 || idx >= currentTracks.length) return;
  currentTrackIdx = idx;
  const waveArea = document.getElementById('audioWaveformArea');
  waveArea.innerHTML = '';
  if (activeWs) { try { activeWs.destroy(); } catch(e){} activeWs = null; }

  ensureWavesurfer(() => {
    try {
      const ws = WaveSurfer.create({
        container: waveArea,
        waveColor: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim(),
        progressColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),
        height: 56, barWidth: 2, barGap: 1, barRadius: 2, cursorWidth: 0,
        url: currentTracks[idx].url, interact: true, normalize: true
      });
      activeWs = ws;
      ws.on('ready', () => { ws.play(); });
      ws.on('play', () => { updateTrackRows(currentTrackIdx, true); });
      ws.on('pause', () => { updateTrackRows(currentTrackIdx, false); });
      ws.on('finish', () => { updateTrackRows(-1, false); currentTrackIdx = -1; });
      ws.on('error', () => {
        waveArea.innerHTML = '<div style="padding:12px;color:var(--text-secondary);font-size:.75rem;">⚠️ Could not load audio</div>';
      });
    } catch(e) {
      waveArea.innerHTML = '<div style="padding:12px;color:var(--text-secondary);font-size:.75rem;">⚠️ Waveform error</div>';
    }
  });
}

function openAudioModal(project) {
  const posterContainer = document.getElementById('audioModalPoster');
  if (project.poster) {
    posterContainer.innerHTML = '<img src="' + project.poster + '" alt="' + (project.title||'') + '">';
    posterContainer.style.display = 'block';
  } else {
    posterContainer.innerHTML = '';
    posterContainer.style.display = 'none';
  }

  document.getElementById('audioModalTitle').textContent = project.title;
  document.getElementById('audioModalSubtitle').textContent = (project.meta || '');

  const tagsContainer = document.getElementById('audioModalTags');
  tagsContainer.innerHTML = '';
  (project.roles || []).forEach(r => {
    const displayName = roleDisplayMap[r] || formatTagName(r);
    const span = document.createElement('span');
    span.className = 'tag role';
    span.textContent = displayName;
    tagsContainer.appendChild(span);
  });
  (project.tags || []).forEach(t => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.textContent = formatTagName(t);
    tagsContainer.appendChild(span);
  });

  if (activeWs) { try { activeWs.destroy(); } catch(e){} activeWs = null; }
  currentTrackIdx = -1;
  currentTracks = project.audioTracks || [];
  document.getElementById('audioWaveformArea').innerHTML = '';

  const trackList = document.getElementById('audioTrackList');
  trackList.innerHTML = '';
  if (currentTracks.length === 0) return;

  currentTracks.forEach((track, idx) => {
    const row = document.createElement('div');
    row.className = 'audio-track-row';
    const trackName = track.name || ('Track ' + (idx + 1));
    row.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span class="audio-track-name">' + trackName + '</span>';
    row.addEventListener('click', () => {
      if (currentTrackIdx === idx && activeWs && activeWs.isPlaying()) {
        activeWs.pause();
      } else {
        loadAndPlayTrack(idx);
      }
    });
    trackList.appendChild(row);
  });

  document.getElementById('audioModal').classList.add('active');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { setTimeout(() => loadAndPlayTrack(0), 200); });
}

function closeAudioModal() {
  if (activeWs) { try { activeWs.destroy(); } catch(e){} activeWs = null; }
  currentTrackIdx = -1;
  currentTracks = [];
  document.getElementById('audioModal').classList.remove('active');
  document.body.style.overflow = '';
}

// Theme
const themeToggle = document.getElementById('themeToggle');
const sunIcon = themeToggle.querySelector('.sun-icon');
const moonIcon = themeToggle.querySelector('.moon-icon');
const themeLabel = themeToggle.querySelector('.theme-label');
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeToggle(savedTheme);
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next); updateThemeToggle(next);
});
function updateThemeToggle(theme) {
  sunIcon.style.display = theme === 'dark' ? 'block' : 'none';
  moonIcon.style.display = theme === 'dark' ? 'none' : 'block';
  themeLabel.textContent = theme === 'dark' ? 'Light' : 'Dark';
}

// Filters
const filterContainer = document.getElementById('filterContainer');
const toggleBtn = document.createElement('button');
toggleBtn.className = 'filter-toggle-btn';
toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg> <span class="toggle-label">Filter Projects</span>';
filterContainer.appendChild(toggleBtn);
const rowsWrapper = document.createElement('div'); rowsWrapper.className = 'filter-rows-wrapper';
PORTFOLIO_CONFIG.filters.forEach(filter => {
  const row = document.createElement('div'); row.className = 'filter-row';
  row.innerHTML = '<span class="filter-label">' + filter.label + '</span>';
  const allBtn = document.createElement('button'); allBtn.className = 'filter-btn active';
  allBtn.dataset.filter = filter.key; allBtn.dataset.value = 'all'; allBtn.textContent = 'All'; row.appendChild(allBtn);
  filter.options.forEach(opt => {
    const btn = document.createElement('button'); btn.className = 'filter-btn';
    btn.dataset.filter = filter.key; btn.dataset.value = opt.value; btn.textContent = opt.label;
    if (opt.tooltip) btn.title = opt.tooltip; // Add tooltip to filter button
    row.appendChild(btn);
  });
  rowsWrapper.appendChild(row);
});
const resultCount = document.createElement('div'); resultCount.className = 'result-count'; resultCount.id = 'resultCount';
rowsWrapper.appendChild(resultCount); filterContainer.appendChild(rowsWrapper);
toggleBtn.addEventListener('click', () => { rowsWrapper.classList.toggle('open'); toggleBtn.classList.toggle('open'); });
function updateToggleBadge() {
  const ac = Object.values(activeFilters).filter(v => v !== 'all').length;
  const ls = toggleBtn.querySelector('.toggle-label');
  const eb = toggleBtn.querySelector('.badge'); if (eb) eb.remove();
  if (ac > 0) { ls.textContent = 'Filters'; const b = document.createElement('span'); b.className = 'badge'; b.textContent = ac; toggleBtn.insertBefore(b, toggleBtn.firstChild); }
  else { ls.textContent = 'Filter Projects'; }
}

const grid = document.getElementById('projectsGrid');
const activeFilters = {};
PORTFOLIO_CONFIG.filters.forEach(f => activeFilters[f.key] = 'all');

// Parse URL hash on load
function parseHashFilters() {
  const hash = window.location.hash.substring(1);
  if (!hash) return;
  const params = new URLSearchParams(hash);
  params.forEach((value, key) => {
    if (activeFilters.hasOwnProperty(key)) {
      activeFilters[key] = value;
    }
  });
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const filterKey = btn.dataset.filter;
    const filterValue = btn.dataset.value;
    if (activeFilters[filterKey] === filterValue) {
      btn.classList.add('active');
    } else if (filterValue === 'all') {
      btn.classList.remove('active');
    }
  });
}
parseHashFilters();

// Update URL hash when filters change
function updateHash() {
  const params = new URLSearchParams();
  Object.keys(activeFilters).forEach(key => {
    if (activeFilters[key] !== 'all') {
      params.set(key, activeFilters[key]);
    }
  });
  const newHash = params.toString() ? '#' + params.toString() : '';
  if (window.location.hash !== newHash) {
    history.pushState(null, '', window.location.pathname + window.location.search + newHash);
  }
}

// Handle back/forward buttons
window.addEventListener('hashchange', () => {
  Object.keys(activeFilters).forEach(key => { activeFilters[key] = 'all'; });
  parseHashFilters();
  renderProjects();
});

function renderProjects() {
  const filtered = PORTFOLIO_PROJECTS.filter(p => {
    return PORTFOLIO_CONFIG.filters.every(f => {
      if (activeFilters[f.key] === 'all') return true;
      if (f.key === 'studio') {
        if (activeFilters[f.key] === 'freelance') return p.studio === 'freelance';
        else if (activeFilters[f.key] === 'other') return p.studio !== 'freelance';
      }
      if (f.key === 'role') return (p.roles || []).includes(activeFilters[f.key]);
      return p[f.key] === activeFilters[f.key];
    });
  });
  const sorted = [...filtered.filter(p => p.pinned), ...filtered.filter(p => !p.pinned)];
  grid.innerHTML = '';
  if (sorted.length === 0) {
    grid.innerHTML = '<div class="empty-state"><h3>No projects match your filters</h3><p>Try adjusting your selections.</p></div>';
  } else {
    sorted.forEach(p => {
      const card = document.createElement('div');
      card.className = 'project-card' + (p.pinned ? ' pinned' : '');
      const pu = p.poster || '';
      let posterHTML = pu
        ? '<img src="' + pu + '" alt="' + (p.title||'') + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=poster-placeholder><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1&quot;><rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;18&quot; height=&quot;18&quot; rx=&quot;2&quot;/><path d=&quot;M3 9h18&quot;/><path d=&quot;M9 21V9&quot;/></svg><span>Image unavailable</span></div>\'">'
        : '<div class="poster-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg><span>Add poster</span></div>';
      let actionsHTML = '<div class="card-actions">';
      if (p.videoEmbed && p.videoEmbed.trim()) {
        const se = p.videoEmbed.replace(/'/g,"&#39;").replace(/"/g,"&quot;");
        actionsHTML += '<button class="play-btn" data-embed=\'' + se + '\' title="Play video"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>';
      }
      if (p.audioTracks && p.audioTracks.length > 0) {
        actionsHTML += '<button class="listen-btn" data-project-idx="' + PORTFOLIO_PROJECTS.indexOf(p) + '" title="Listen to audio"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>';
      }
      actionsHTML += '</div>';
      const ub = p.upcoming ? '<span class="upcoming-badge">Upcoming</span>' : '';
      const pb = p.pinned ? '<span class="pinned-badge">★ Featured</span>' : '';
      
      // Category with tooltip
      const catVal = p.category || '';
      const catTip = tooltipMap[`category:${catVal}`];
      const catTipAttr = catTip ? ` title="${catTip.replace(/"/g, '&quot;')}"` : '';
      
      // Roles with tooltips
      const roles = (p.roles || []).map(r => {
        const label = roleDisplayMap[r] || formatTagName(r);
        const tip = tooltipMap[`role:${r}`];
        const tipAttr = tip ? ` title="${tip.replace(/"/g, '&quot;')}"` : '';
        return `<span class="tag role"${tipAttr}>${label}</span>`;
      }).join('');
      
      const tags = (p.tags || []).map(t => '<span class="tag">' + formatTagName(t) + '</span>').join('');
      const techHTML = (p.techStack && p.techStack.length > 0)
        ? '<div class="card-tech">' + p.techStack.map(t => '<span class="tech-tag">' + t + '</span>').join('') + '</div>' : '';
      const linkHTML = p.referenceLink
        ? '<a href="' + p.referenceLink + '" target="_blank" class="card-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' + (p.referenceLinkText || 'View Reference') + ' →</a>' : '';
      
      card.innerHTML =
        '<div class="card-poster">' + posterHTML + '</div>' +
        '<div class="card-content">' +
          '<div class="card-header-row"><div class="card-header-left">' +
            '<div class="card-category-line"><span class="card-category"' + catTipAttr + '>' + (catVal||'').toUpperCase() + (p.year ? ' • ' + p.year : '') + '</span>' + pb + ub + '</div>' +
            '<div class="card-title">' + (p.title||'') + '</div>' +
          '</div>' + actionsHTML + '</div>' +
          '<div class="card-meta">' + (p.studioLabel||'') + (p.meta ? ' • ' + p.meta : '') + '</div>' +
          '<div class="card-description">' + (p.description||'') + '</div>' +
          techHTML +
          '<div class="card-tags">' + roles + tags + '</div>' +
          linkHTML +
        '</div>';
      grid.appendChild(card);
    });
  }
  resultCount.textContent = 'Showing ' + sorted.length + ' of ' + PORTFOLIO_PROJECTS.length + ' projects';
  updateToggleBadge();
}

document.addEventListener('click', e => {
  const pb = e.target.closest('.play-btn');
  if (pb) { openModal('projectVideoModal','projectVideoIframe',pb.dataset.embed); return; }
  const lb = e.target.closest('.listen-btn');
  if (lb) { const idx = parseInt(lb.dataset.projectIdx); if (!isNaN(idx) && PORTFOLIO_PROJECTS[idx]) openAudioModal(PORTFOLIO_PROJECTS[idx]); return; }
  if (e.target.classList.contains('filter-btn')) {
    const btn = e.target;
    document.querySelectorAll('.filter-btn[data-filter="' + btn.dataset.filter + '"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); activeFilters[btn.dataset.filter] = btn.dataset.value;
    updateHash();
    renderProjects(); 
    
    // Smooth scroll to grid, stopping exactly below the sticky filter bar
    const filterBar = document.querySelector('.filter-bar');
    const gridTop = grid.getBoundingClientRect().top + window.scrollY;
    const filterHeight = filterBar.offsetHeight;
    window.scrollTo({ top: gridTop - filterHeight - 16, behavior: 'smooth' });
  }
});

renderProjects();
</script>
</body>
